
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alliance University Fest Countdown</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css?v=4">
</head>

<body data-popup="">

    <!-- CAMPUS BACKGROUND -->
    <div id="backgroundLayer"></div>

    <!-- GOLDEN SCROLLING SPONSOR LOGOS -->
    <div id="logoLayer" class="hide-in-video"></div>

    <!-- READABILITY OVERLAYS -->
    <div id="readMask" class="hide-in-video"></div>
    <div id="focusMask" class="hide-in-video"></div>

    <!-- VIDEO PLAYBACK -->
    <div id="videoLayer">
        <video
            id="video"
            src="assets/videos/vid.mp4"
            playsinline
            muted
            preload="auto"
        ></video>
    </div>

    <!-- MAIN DISPLAY -->
    <main id="stage">

        <!-- HEADER -->
        <header id="header" class="hide-in-video">

            <!-- EVENT TITLES -->
            <div id="eventsRow">

                <div class="event">
                    <b>CodeSangram 3.0</b>
                    <span>National Hackathon</span>
                </div>

                <div class="event">
                    <b>RanShastra 3.0</b>
                    <span>AstraArena E-sports Championship</span>
                </div>

                <div class="event">
                    <b>iPragyan</b>
                    <span>Mobile Filmmaking Competition</span>
                </div>

                <div class="event">
                    <b>iPragyan</b>
                    <span>Paper to Pixel</span>
                </div>

            </div>

            <!-- ALLIANCE UNIVERSITY LOGO -->
            <div class="logo-slot">
                <img
                    id="mainLogo"
                    src="assets/logos/au.png"
                    alt="Alliance University"
                >
            </div>

            <!-- OPTIONAL BRANDING FALLBACK -->
            <span id="logoFallback" hidden>
                ALLIANCE UNIVERSITY
            </span>

        </header>

        <!-- COUNTDOWN -->
        <section id="timerContainer">

            <div id="timerBox">

                <div id="dayLabel">DAY 1</div>

                <div id="clock">07:00:00</div>

                <div id="units" class="hide-in-video">
                    <span>HOURS</span>
                    <i></i>
                    <span>MINUTES</span>
                    <i></i>
                    <span>SECONDS</span>
                </div>

            </div>

            <!-- RETAINED FOR TIMER MASKING -->
            <div id="timerOcclusion"></div>
            <div id="timerMask"></div>
            <div id="dayMask"></div>

        </section>

        <!-- DIRECTOR POPUP: ADMIN KEY D -->
        <aside
            id="directorPanel"
            class="panel hide-in-video"
            aria-label="Director information"
        >

            <div class="panel-title">DIRECTOR</div>

            <div class="director-frame">
                <img
                    id="directorImg"
                    src="assets/logos/director.png"
                    alt="Director"
                >
            </div>

            <div id="directorName"></div>

            <div id="directorCaption">
                ALLIANCE UNIVERSITY
            </div>

        </aside>

        <!-- FACULTY POPUP: ADMIN KEY M -->
        <aside
            id="facultyPanel"
            class="panel hide-in-video"
            aria-label="Faculty members"
        >

            <div class="panel-title">
                OUR ESTEEMED FACULTY
            </div>

            <div id="facultyGrid">
                <!-- Faculty cards are generated by script.js -->
            </div>

        </aside>

        <!-- SPONSORS -->
        <footer id="sponsors" class="hide-in-video">

            <div id="sponsorTitle">
                OUR PROUD SPONSORS
            </div>

            <div id="sponsorRow">
                <!-- Sponsor logos are generated by script.js -->
            </div>

        </footer>

    </main>

    <!-- SOCKET.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- APPLICATION LOGIC -->
    <script src="script.js?v=4"></script>

</body>
</html>
